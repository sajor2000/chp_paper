schema_version: 1
registry_date: "2026-07-13"
access_timezone: "America/Chicago"
project: "ChicagoHealthMap scientific analysis pipeline"

study_scope:
  population: "Adults aged 18 years or older"
  primary_geography: "City of Chicago census tracts and community areas"
  validation_geography: "Cook County and Illinois where supported"
  case_studies:
    - "Cardiometabolic burden: hypertension and diagnosed diabetes, jointly and separately"
    - "Respiratory burden: chronic obstructive pulmonary disease (COPD)"
  outcome_context:
    - "Life expectancy"
    - "All-cause mortality"
    - "Heart disease, diabetes, chronic lower respiratory disease, and stroke mortality"

governance:
  raw_data_policy: "Preserve downloaded API responses and official bulk files byte-for-byte under original/."
  checksum_policy: "Verify raw files against SHA-256 manifests before transformation."
  citation_policy: "Cite the originating public agency for measures and methodology; also cite the access platform when data are retrieved through an aggregator."
  licensing_policy: "Public accessibility is not assumed to grant unrestricted redistribution. Review each source's terms before sharing raw files."
  analysis_gate: "No package, notebook, statistical, or figure code may begin until this registry and the checksum manifests pass validation."

