[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chicagohealthmap"
version = "0.1.0"
description = "Reproducible scientific pipelines for Chicago Health Map data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas",
    "great-tables",
    "httpx",
    "marimo",
    "matplotlib",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pyogrio",
    "pyyaml",
    "scipy",
    "shapely",
    "statsmodels",
    "tenacity",
    "typer",
]

[project.scripts]
chicagohealthmap = "chicagohealthmap.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["chicagohealthmap"]
mypy_path = "src"
