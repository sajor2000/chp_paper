  - source_id: chicago_health_atlas_life_expectancy
    organization: Chicago Health Atlas
    dataset_title: Life expectancy
    analytical_purpose: Community-area life-expectancy outcome and inequity context.
    transport: documented_export
    official_domain: chicagohealthatlas.org
    landing_url: https://chicagohealthatlas.org/indicators/VRLE
    documentation_url: https://chicagohealthatlas.org/api/v1/topics/?limit=10000
    endpoint_url: https://chicagohealthatlas.org/api/v1/data/
    catalog_id: VRLE
    release: Live API coverage verified 2026-07-14; frozen snapshot 2026-07-13
    years: ["2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024"]
    geography: "77 Chicago community areas (API layer: neighborhood)"
    license: Public access confirmed; API metadata does not state a redistribution license, so raw redistribution requires terms review.
    access_date: 2026-07-14
    citation: Chicago Health Atlas. Life expectancy (VRLE); originating source Illinois Department of Public Health Death Certificate Data Files. Accessed July 14, 2026.
    citation_url: https://chicagohealthatlas.org/indicators/VRLE
    expected_grain: community area × annual period × population stratum
    primary_key: [g, l, a, p, d]
    request:
      method: GET
      url: https://chicagohealthatlas.org/api/v1/data/
      parameters: {topic: VRLE, population: "", layer: neighborhood, period: "{period}"}
    fallback:
      policy: Retain and checksum the frozen 2026-07-13 API responses; do not replace with a derivative.
      status: frozen_snapshot_available
      reason: Live coverage agrees with the frozen metadata; no new bulk download is authorized at Task 11.
      url: https://chicagohealthatlas.org/api/v1/coverage/VRLE/
    verification:
      status: verified
      verified_at: 2026-07-14
      evidence_urls: ["https://chicagohealthatlas.org/api/v1/topics/?limit=10000", https://chicagohealthatlas.org/api/v1/coverage/VRLE/]
      notes: VRLE is distinct from mortality; annual 2010-2024 community-area values use v for estimate and se for uncertainty, although standard error may be null.
      ref_mcp_status: &ref_status "unavailable: OAuth authorization required; official primary documentation used"
      tavily_status: &tavily_status "unavailable: monthly_cap_reached_bonus_eligible on 2026-07-14; no retry or enrollment"

