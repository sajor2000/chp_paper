  - source_id: cdc_places_current_tract
    organization: Centers for Disease Control and Prevention
    dataset_title: "PLACES: Census Tract Data (GIS Friendly Format), 2025 release"
    analytical_purpose: External model-based tract estimates for high blood pressure, diagnosed diabetes, and COPD; not observed EHR prevalence.
    transport: socrata
    official_domain: data.cdc.gov
    landing_url: https://data.cdc.gov/500-Cities-Places/PLACES-Census-Tract-Data-GIS-Friendly-Format-2025-/yjkw-uj5s
    documentation_url: https://data.cdc.gov/api/views/yjkw-uj5s
    endpoint_url: https://data.cdc.gov/resource/yjkw-uj5s.csv
    catalog_id: yjkw-uj5s
    release: 2025 release; BRFSS model inputs 2023/2022; 2023 tract boundaries
    years: ["2025 release", "2023 BRFSS", "2022 BRFSS biennial measures", "2023 tract boundaries"]
    geography: Request restricts to Cook County, Illinois tracts; downstream analysis intersects the Chicago study boundary
    license: Public Domain in Socrata metadata.
    access_date: 2026-07-14
    citation: Centers for Disease Control and Prevention. PLACES Census Tract Data (GIS Friendly Format), 2025 release, dataset yjkw-uj5s.
    citation_url: https://data.cdc.gov/500-Cities-Places/PLACES-Census-Tract-Data-GIS-Friendly-Format-2025-/yjkw-uj5s
    expected_grain: one Cook County census tract per row with model-based hypertension, diabetes, and COPD estimates and confidence intervals
    primary_key: [tractfips]
    request:
      method: GET
      url: https://data.cdc.gov/resource/yjkw-uj5s.csv
      parameters:
        $select: stateabbr,statedesc,countyname,countyfips,tractfips,totalpopulation,totalpop18plus,bphigh_crudeprev,bphigh_crude95ci,diabetes_crudeprev,diabetes_crude95ci,copd_crudeprev,copd_crude95ci
        $where: "stateabbr='IL' AND countyfips='17031'"
        $order: tractfips ASC
        $limit: "50000"
    fallback:
      policy: Retain the frozen 2025-release Illinois extract and Socrata metadata byte-for-byte.
      status: frozen_snapshot_available
      reason: Live dataset identity, model inputs, and boundary vintage agree with the frozen snapshot.
      url: https://data.cdc.gov/api/views/yjkw-uj5s
    verification:
      status: verified
      verified_at: 2026-07-14
      evidence_urls: [https://data.cdc.gov/api/views/yjkw-uj5s, https://data.cdc.gov/resource/yjkw-uj5s.csv]
      notes: Metadata identifies 40 model-based measures, primarily 2023 BRFSS with five 2022 biennial measures, Census 2020 population, ACS 2019-2023/2018-2022, and 2023 tract boundaries.
      ref_mcp_status: *ref_status
      tavily_status: *tavily_status

