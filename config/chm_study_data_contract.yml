contract_version: 1
contract_status: study_specific_verified_interface_with_open_semantic_gates

evidence:
  audited_at: "2026-08-27"
  source: "Read-only Neon PostgreSQL information_schema, pg_catalog, relation comments, and aggregate reconciliation queries"
  database_role: "read_only_role_identifier_omitted_from_public_release"
  transaction_read_only: true
  credential_material_stored: false
  limitation: >-
    The database contains aggregate geography-condition-year records, not patient-level
    records. The audit verifies stored schema and aggregate consistency but cannot verify
    MRAIA deduplication, patient-level denominator construction, or diabetes mutual
    exclusivity.

study_scope:
  source_years: [2019, 2020, 2021, 2022, 2023, 2024]
  source_counties:
    - {fips: "17031", name: "Cook"}
    - {fips: "17043", name: "DuPage"}
    - {fips: "17089", name: "Kane"}
    - {fips: "17097", name: "Lake"}
    - {fips: "17111", name: "McHenry"}
    - {fips: "17197", name: "Will"}
  primary_analysis_geography: census_tract
  chicago_boundary_rule_status: provisional_primary_representative_point_requires_statistician_signoff
  chicago_boundary_rule_primary: 2024_tiger_tract_representative_point_covered_by_frozen_77_area_union
  chicago_boundary_rule_sensitivity: at_least_50_percent_of_tract_area_covered_by_frozen_77_area_union
  prohibited_boundary_rule: any_polygon_intersection
  annual_tract_minimum_denominator: 30

