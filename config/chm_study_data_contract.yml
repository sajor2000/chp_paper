table_bindings:
  fact_tract_condition_stats.text:
    geography_column: geocode_tract
    geography_dimension: dim_census_tracts.text
    stored_measure: crude_ehr_diagnosed_proportion
    denominator_contract: annual_unique_observed_adults_with_at_least_one_of_39_conditions
    primary_estimand_authorized: true
  fact_community_area_condition_stats.text:
    geography_column: community_area_id
    geography_dimension: dim_community_areas.text
    stored_measure: source_density_weighted_diagnosed_proportion
    denominator_contract: condition_varying_source_denominator
    primary_estimand_authorized: false
  fact_zcta_condition_stats.text:
    geography_column: zcta5
    geography_dimension: dim_zcta.text
    stored_measure: source_density_weighted_diagnosed_proportion
    denominator_contract: condition_varying_source_denominator
    primary_estimand_authorized: false
  fact_chicago_condition_prevalence.text:
    geography_column: chicago
    derivation: ratio_of_summed_community_area_numerators_and_denominators
    primary_estimand_authorized: false

raw_data_gates:
  - tract_denominator_constant_within_geography_year
  - tract_published_measure_equals_numerator_divided_by_denominator_when_denominator_positive
  - tract_positive_counts_below_10_absent
  - counts_nonnegative_and_numerator_not_greater_than_denominator
  - published_proportions_within_zero_one
  - out_of_scope_county_rows_have_zero_numerator_and_denominator
  - fact_keys_unique_within_geography_condition_year
  - chicago_table_equals_ratio_of_sums_from_community_area_table
  - tract_denominator_equals_annual_capture_count_for_linked_tract_years

fail_closed_semantics:
  zero_count: zero_or_suppressed_unresolved
  missing_row: not_observed_not_zero
  positive_count_below_10: conflicts_with_public_suppression_description
  community_area_weighting: exact_density_weighting_and_rounding_specification_required
  zcta_weighting: exact_density_weighting_and_rounding_specification_required
  capture_rate: retain_supplied_static_value_do_not_recompute
  annual_tract_eligibility: chicago_primary_boundary_and_denominator_at_least_30_and_observable_after_suppression
  diabetes_combination: blocked_pending_patient_level_mutual_exclusivity_and_denominator_equivalence
