    purpose: Resource and informatics precedents
    rationale: Identify how electronic health records have supported public-health surveillance.
    planned_evidence_use: Frame the platform's informatics and surveillance contribution.
    concepts:
      - electronic health records
      - public health surveillance
    active_version: 1
    versions:
      - version: 1
        query: '("Electronic Health Records"[MeSH] OR electronic health record*[Title/Abstract] OR EHR[Title/Abstract]) AND ("Public Health Surveillance"[MeSH] OR public health surveillance[Title/Abstract] OR population health surveillance[Title/Abstract])'
        status: frozen
        frozen_on: "2026-07-14"
        amendment_reason: Initial prespecified query
        approval_status: initial_prespecified_freeze
        approved_by: null
        screening_phase: before_screening
